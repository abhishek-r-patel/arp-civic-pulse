<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000"
  height="270"
  viewBox="0 0 1000 270"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Registering a representative</title>
  <desc id="desc">
    Create the resident account suspended, assign it to a unique household, mark
    the household eligible if approved, enable the account, and include that
    household when activating future votes.
  </desc>
  <defs>
    <marker
      id="a"
      markerWidth="10"
      markerHeight="10"
      refX="8"
      refY="3"
      orient="auto"
    >
      <path d="M0 0 L0 6 L8 3Z" fill="#475569" />
    </marker>
  </defs>
  <rect width="1000" height="270" rx="12" fill="#f8fafc" />
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#0f172a">
    <text x="500" y="32" font-size="22" font-weight="bold">
      Create account first; assign household before enabling a resident
    </text>
    <g fill="#fff" stroke="#0f766e" stroke-width="2">
      <rect x="15" y="75" width="210" height="100" rx="10" />
      <rect x="265" y="75" width="210" height="100" rx="10" />
      <rect x="515" y="75" width="210" height="100" rx="10" />
      <rect x="765" y="75" width="220" height="100" rx="10" />
    </g>
    <g font-size="17">
      <text x="120" y="112">Create resident</text>
      <text x="120" y="143">Initially suspended</text>
      <text x="370" y="112">Assign household</text>
      <text x="370" y="143">Set eligibility correctly</text>
      <text x="620" y="112">Enable account</text>
      <text x="620" y="143">Confirm access change</text>
      <text x="875" y="112">Select in new draft</text>
      <text x="875" y="143">Freeze on activation</text>
    </g>
    <text x="500" y="215" font-size="16">
      An administrator may exist without a household, but cannot vote without an
      entitlement.
    </text>
    <text x="500" y="245" font-size="16">
      Register edits do not transfer existing frozen entitlements or erase
      accepted votes.
    </text>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#a)">
    <path d="M225 125H255" />
    <path d="M475 125H505" />
    <path d="M725 125H755" />
  </g>
</svg>
