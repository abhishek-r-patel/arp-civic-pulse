<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000"
  height="420"
  viewBox="0 0 1000 420"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Vote lifecycle</title>
  <desc id="desc">
    A draft can activate now or freeze as Scheduled. A scheduled vote opens at
    database time or returns to draft before opening with a recorded reason.
    Active voting completes at the deadline or early with a reason, or is
    cancelled with a reason. Terminal votes never reopen.
  </desc>
  <defs>
    <marker
      id="a"
      markerWidth="10"
      markerHeight="10"
      refX="8"
      refY="3"
      orient="auto"
    >
      <path d="M0 0 L0 6 L8 3Z" fill="#475569" />
    </marker>
  </defs>
  <rect width="1000" height="420" rx="12" fill="#f8fafc" />
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#0f172a">
    <text x="500" y="32" font-size="22" font-weight="bold">
      Voting type is separate from lifecycle status
    </text>
    <g fill="#fff" stroke-width="2">
      <rect x="25" y="100" width="190" height="90" rx="10" stroke="#64748b" />
      <rect x="25" y="235" width="190" height="90" rx="10" stroke="#475569" />
      <rect x="360" y="100" width="190" height="90" rx="10" stroke="#0f766e" />
      <rect x="780" y="60" width="195" height="90" rx="10" stroke="#15803d" />
      <rect x="780" y="205" width="195" height="80" rx="10" stroke="#b91c1c" />
    </g>
    <g font-size="19" font-weight="bold">
      <text x="120" y="135">Draft</text>
      <text x="120" y="270">Scheduled</text>
      <text x="455" y="135">Active</text>
      <text x="877" y="95">Completed</text>
      <text x="877" y="238">Cancelled</text>
    </g>
    <g font-size="15">
      <text x="120" y="162">Editable, not resident-visible</text>
      <text x="120" y="298">Frozen, summary visible</text>
      <text x="455" y="162">Frozen, accepts eligible votes</text>
      <text x="877" y="122">Authorized results available</text>
      <text x="877" y="265">No valid results or exports</text>
      <text x="286" y="90">Preview + activate now</text>
      <text x="220" y="220">Freeze + schedule</text>
      <text x="300" y="312">Opens automatically</text>
      <text x="120" y="355">Return to draft</text>
      <text x="120" y="375">Before opening + reason</text>
      <text x="656" y="71">Deadline or early + reason</text>
      <text x="656" y="217">Cancel + reason</text>
      <text x="625" y="390">
        No terminal reopening. Active deadlines may move with a reason.
      </text>
    </g>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M215 145H350" />
    <path d="M120 190V225" />
    <path d="M215 280H300V185H350" />
    <path d="M25 280H10V145H15" />
    <path d="M550 130H650V105H770" />
    <path d="M550 165H650V245H770" />
  </g>
</svg>
