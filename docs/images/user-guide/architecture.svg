<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000"
  height="430"
  viewBox="0 0 1000 430"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Application trust boundaries</title>
  <desc id="desc">
    Browser calls same-origin Next.js pages and APIs. Server services verify
    Supabase Auth and current profile permissions, then use the user's database
    client for RLS and guarded routines. A separate privileged client handles
    Auth administration and limiter routines only. PostgreSQL stores
    participation with OPEN responses or CLOSED aggregate counters atomically.
  </desc>
  <defs>
    <marker
      id="a"
      markerWidth="10"
      markerHeight="10"
      refX="8"
      refY="3"
      orient="auto"
    >
      <path d="M0 0 L0 6 L8 3Z" fill="#475569" />
    </marker>
  </defs>
  <rect width="1000" height="430" rx="12" fill="#f8fafc" />
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#0f172a">
    <text x="500" y="32" font-size="22" font-weight="bold">
      Authorization is enforced on the server AND in PostgreSQL
    </text>
    <g fill="#fff" stroke="#0f766e" stroke-width="2">
      <rect x="20" y="75" width="210" height="90" rx="10" />
      <rect x="320" y="75" width="300" height="90" rx="10" />
      <rect x="720" y="75" width="260" height="90" rx="10" />
      <rect x="320" y="270" width="300" height="100" rx="10" />
      <rect x="720" y="270" width="260" height="100" rx="10" />
    </g>
    <g font-size="17">
      <text x="125" y="110">Browser / React</text>
      <text x="125" y="140">No trusted role or identity</text>
      <text x="470" y="110">Next.js pages / HTTP boundary</text>
      <text x="470" y="140">Origin, CSRF, Zod, services</text>
      <text x="850" y="110">Supabase Auth</text>
      <text x="850" y="140">OTP, getUser, refresh</text>
      <text x="470" y="302">User-session database client</text>
      <text x="470" y="330">RLS + guarded SQL functions</text>
      <text x="470" y="355">Permissions and durable commit</text>
      <text x="850" y="302">Isolated privileged client</text>
      <text x="850" y="330">Auth admin, provisioning,</text>
      <text x="850" y="355">limiting / reconciliation</text>
    </g>
    <g font-size="14">
      <text x="264" y="65">Same origin</text>
      <text x="470" y="215">Verified user; current enabled profile</text>
      <text x="850" y="215">Never ordinary ballot/result reads</text>
      <text x="500" y="405">
        CLOSED: participation + counters, not individual ballots. Cron uses a
        restricted scheduler role.
      </text>
    </g>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M230 120H310" />
    <path d="M620 120H710" />
    <path d="M470 165V260" />
    <path d="M600 165V235H850V260" />
  </g>
</svg>
