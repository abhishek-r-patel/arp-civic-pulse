<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000"
  height="470"
  viewBox="0 0 1000 470"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Safe voting and connection recovery</title>
  <desc id="desc">
    Choose, review and submit. A confirmed acceptance is final. If the
    acknowledgement is unclear, check participation. For a first submission,
    an unavailable check means wait and check again without submitting blindly.
    For an OPEN replacement, the previous response remains recorded, and the
    same intended replacement may be retried while the poll is active.
  </desc>
  <defs>
    <marker
      id="a"
      markerWidth="10"
      markerHeight="10"
      refX="8"
      refY="3"
      orient="auto"
    >
      <path d="M0 0 L0 6 L8 3Z" fill="#475569" />
    </marker>
  </defs>
  <rect width="1000" height="470" rx="12" fill="#f8fafc" />
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#0f172a">
    <text x="500" y="32" font-size="22" font-weight="bold">
      A lost response is not proof that a vote failed
    </text>
    <g fill="#fff" stroke="#0f766e" stroke-width="2">
      <rect x="20" y="65" width="200" height="65" rx="10" />
      <rect x="280" y="65" width="200" height="65" rx="10" />
      <rect x="540" y="65" width="200" height="65" rx="10" />
      <rect x="780" y="65" width="200" height="65" rx="10" />
      <rect x="540" y="215" width="200" height="75" rx="10" />
      <rect x="20" y="365" width="250" height="75" rx="10" />
      <rect x="375" y="365" width="250" height="75" rx="10" />
      <rect x="730" y="365" width="250" height="75" rx="10" />
    </g>
    <g font-size="17">
      <text x="120" y="104">Choose all required fields</text>
      <text x="380" y="104">Review selections</text>
      <text x="640" y="104">Submit / update OPEN</text>
      <text x="880" y="104">Response accepted</text>
      <text x="640" y="245">Unclear response?</text>
      <text x="640" y="272">Check participation</text>
      <text x="145" y="395">Recorded</text>
      <text x="145" y="423">Change OPEN choice before close</text>
      <text x="500" y="395">Confirmed not recorded</text>
      <text x="500" y="423">Review and retry if allowed</text>
      <text x="855" y="395">Check also unavailable</text>
      <text x="855" y="418">First vote: wait/check again</text>
      <text x="855" y="438">OPEN change: retry if active</text>
    </g>
    <g font-size="14">
      <text x="640" y="181">Connection problem</text>
      <text x="850" y="155">Clear acceptance only</text>
    </g>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M220 97H270" />
    <path d="M480 97H530" />
    <path d="M740 97H770" />
    <path d="M640 130V205" />
    <path d="M640 290V325H145V355" />
    <path d="M640 290V325H500V355" />
    <path d="M640 290V325H855V355" />
  </g>
</svg>
