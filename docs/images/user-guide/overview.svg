<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000"
  height="350"
  viewBox="0 0 1000 350"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Civic Pulse: from register to results</title>
  <desc id="desc">
    The administrator sets up households, creates and previews a draft, then
    activates it. Residents sign in, review and submit once. Completion
    publishes authorized results and downloads.
  </desc>
  <defs>
    <marker
      id="arrow"
      markerWidth="10"
      markerHeight="10"
      refX="8"
      refY="3"
      orient="auto"
    >
      <path d="M0 0 L0 6 L8 3Z" fill="#475569" />
    </marker>
  </defs>
  <rect width="1000" height="350" rx="12" fill="#f8fafc" />
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#0f172a">
    <text x="500" y="32" font-size="22" font-weight="bold">
      One current response per household. OPEN choices can change until closing.
    </text>
    <g fill="#fff" stroke="#0f766e" stroke-width="2">
      <rect x="20" y="65" width="210" height="90" rx="10" />
      <rect x="270" y="65" width="210" height="90" rx="10" />
      <rect x="520" y="65" width="210" height="90" rx="10" />
      <rect x="770" y="65" width="210" height="90" rx="10" />
      <rect x="270" y="215" width="210" height="90" rx="10" />
      <rect x="520" y="215" width="210" height="90" rx="10" />
      <rect x="770" y="215" width="210" height="90" rx="10" />
    </g>
    <g font-size="17">
      <text x="125" y="99">Register accounts</text>
      <text x="125" y="125">and households</text>
      <text x="375" y="99">Create draft</text>
      <text x="375" y="125">OPEN or CLOSED</text>
      <text x="625" y="99">Save and preview</text>
      <text x="625" y="125">Correct any blockers</text>
      <text x="875" y="99">Activate explicitly</text>
      <text x="875" y="125">Ballot and voters freeze</text>
      <text x="375" y="250">Residents sign in</text>
      <text x="375" y="276">Choose and review</text>
      <text x="625" y="250">Submit / update OPEN</text>
      <text x="625" y="276">Wait for confirmation</text>
      <text x="875" y="250">Active / completed</text>
      <text x="875" y="276">Live totals / final results*</text>
    </g>
    <text x="500" y="335" font-size="14">
      * PDF is optional. Active OPEN results show aggregates, never identities.
    </text>
  </g>
  <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <path d="M230 110H260" />
    <path d="M480 110H510" />
    <path d="M730 110H760" />
    <path d="M875 155V185H375V205" />
    <path d="M480 260H510" />
    <path d="M730 260H760" />
  </g>
</svg>
